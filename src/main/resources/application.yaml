spring:
  application:
    name: "Stashbox-Bot"
  datasource:
    url: jdbc:p6spy:postgresql://localhost:5435/stashbox
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 100
        transaction:
          jta:
            platform: none
    database: postgresql
  liquibase:
    change-log: classpath:migration/liquibase/changelog-master.yaml

server:
  port: 8082

telegram:
  token: ${TELEGRAM_BOT_TOKEN}
  webhookBaseUrl: ${TELEGRAM_WEBHOOK_BASE_URL}
  webhookPath: ${TELEGRAM_WEBHOOK_PATH}

logging:
  level:
    root: info
    ru.yanin.stashbox.bot.config.telegram: debug
  pattern:
    console: '%d{dd.MM.yyyy HH:mm:ss.SSS} [%thread] %clr(%-5level) %logger{36} - %msg%n'