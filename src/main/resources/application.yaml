spring:
  application:
    name: "Stashbox-Bot"

server:
  port: 8082

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN}
  webhook-base-url: ${TELEGRAM_WEBHOOK_BASE_URL}
  webhook-path: ${TELEGRAM_WEBHOOK_PATH}

logging:
  level:
    root: info
  pattern:
    console: '%d{dd.MM.yyyy HH:mm:ss.SSS} [%thread] %clr(%-5level) %logger{36} - %msg%n'