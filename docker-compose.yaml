services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stashbox
    shm_size: '512mb'
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - general-network
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER" ]
      interval: 10s
      timeout: 5s
      retries: 5


networks:
  general-network:
    driver: bridge

volumes:
  postgres_data:
